# wasteland

- type: biomeTemplate
  id: FinalFrontierWasteland
  layers:
  # Boulder Placement
  - !type:BiomeEntityLayer
    threshold: 0.9
    noise:
      seed: 0
      frequency: 5
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorDesert
    - FloorDesertRocky
    - FloorDesertPlanet
    - FloorAsteroidSandUnvariantizedPlanet
    - FloorCave
    - FloorPlanetGravel
    entities:
    - FloraRockSolidPlanet
  # Fauna Placement
  - !type:BiomeEntityLayer
    threshold: 0.98
    noise:
      seed: 0
      frequency: 3
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorDesert
    - FloorDesertRocky
    - FloorDesertPlanet
    - FloorAsteroidSandUnvariantizedPlanet
    - FloorPlanetGravel
    entities:
    - MonoPlanetmapFaunaDesert
  # Flora Placement
  # Piluma
  - !type:BiomeEntityLayer
    threshold: 0.975
    noise:
      seed: 0
      frequency: 2
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorDesert
    - FloorDesertPlanet
    - FloorAsteroidSandUnvariantizedPlanet
    entities:
    - FloraPilumaPlant
  # Orakim
  - !type:BiomeEntityLayer
    threshold: 0.98
    noise:
      seed: 0
      frequency: 2
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorDesert
    - FloorDesertPlanet
    entities:
    - FloraOrakimPlant
  # Misc. Flora
  - !type:BiomeEntityLayer
    threshold: 0.97
    noise:
      seed: 1
      frequency: 2
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorDesert
    - FloorDesertPlanet
    - FloorPlanetGravel
    entities:
    - FloraTreeStump
  # Junk
  - !type:BiomeEntityLayer
    threshold: 0.925
    noise:
      seed: 2
      frequency: 0.8
      noiseType: OpenSimplex2
    allowedTiles:
    - FloorDesert
    - FloorDesertPlanet
    - FloorCave
    - FloorPlanetGravel
    entities:
    - SalvageSpawnerScrapCommon
    - SalvageSpawnerScrapCommon75
    - SalvageSpawnerScrapValuable
    - SalvageSpawnerScrapValuable75
    - ComputerBroken
    - SalvageCanisterSpawner
    - RustedThruster
    - MachineFrameDestroyed
    - MachineFrameDestroyed2x1
    - ScrapGeneratorUraniumLeaking
    - ScrapOre20
    - ScrapRadioactiveWasteBarrel
    - RandomSpawner100
    - RandomSpawner
  # Rock decals
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorDesert
    - FloorDesertRocky
    - FloorDesertPlanet
    - FloorAsteroidSandUnvariantizedPlanet
    - FloorAsteroidSandPlanet
    - FloorCave
    - FloorPlanetGravel
    threshold: 0.9
    divisions: 1
    noise:
      seed: 1
      frequency: 5
    decals:
    - Basalt1
    - Basalt2
    - Basalt3
    - Basalt4
    - Basalt5
    - Basalt6
    - Basalt7
    - Basalt8
    - Basalt9
  # Bush decals
  - !type:BiomeDecalLayer
    allowedTiles:
    - FloorDesert
    - FloorDesertPlanet
    threshold: 0.9
    divisions: 1
    noise:
      seed: 1
      frequency: 0.9
    decals:
    - Bushj1
    - Bushj2
    - Bushj3
  # Large rock areas
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorAsteroidSandUnvariantizedPlanet
    threshold: -0.285
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.005
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WastelandOreRichSand
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorCave
    threshold: -0.285
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.005
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WastelandOreRichRock
  # Large scrap areas
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorAsteroidSandUnvariantizedPlanet
    - FloorCave
    - FloorDesert
    - FloorDesertRocky
    - FloorDesertPlanet
    - FloorAsteroidSandPlanet
    - FloorPlanetGravel
    threshold: -0.10
    noise:
      seed: 1
      noiseType: Cellular
      frequency: 0.025
      lacunarity: 3
      fractalType: FBm
      octaves: 2
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
    entities:
    - WastelandOreScrap
  # Other shit
  - !type:BiomeEntityLayer
    allowedTiles:
    - FloorCave
    - FloorDesert
    - FloorDesertRocky
    - FloorDesertPlanet
    - FloorAsteroidSandPlanet
    - FloorPlanetGravel
    threshold: 0.99
    noise:
      seed: 2
      frequency: 0.4
      noiseType: OpenSimplex2
    entities:
    - NFSandRoomMarker
    - PlanetWreckRoomMarker
    - NFVGRoidInteriorRoomMarker
    - ShuttleWreckSmallRoomMarker
  - !type:BiomeDummyLayer
    id: Loot
  # Fill layer
  # Base tiles
  - !type:BiomeTileLayer
    threshold: -1
    tile: FloorAsteroidSandPlanet
  # Apply planet desert tile as noise so it doesnt look flat and boring
  - !type:BiomeTileLayer
    threshold: -0.60
    tile: FloorDesertPlanet
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.015
      lacunarity: 3
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
  # Unvariantized tile for rock walls to be placed on
  - !type:BiomeTileLayer
    tile: FloorAsteroidSandUnvariantizedPlanet
    threshold: -0.30
    noise:
      seed: 0
      noiseType: Cellular
      frequency: 0.005
      lacunarity: 2
      fractalType: FBm
      octaves: 5
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
  # Flooring variety.
  - !type:BiomeTileLayer
    tile: FloorPlanetGravel
    threshold: -0.29
    noise:
      seed: 2
      noiseType: Cellular
      frequency: 0.01
      lacunarity: 2
      fractalType: FBm
      octaves: 4
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2
  - !type:BiomeTileLayer
    tile: FloorCave
    threshold: -0.25
    noise:
      seed: 3
      noiseType: Cellular
      frequency: 0.035
      lacunarity: 2
      fractalType: FBm
      octaves: 3
      cellularDistanceFunction: Euclidean
      cellularReturnType: Distance2

