- type: entity
  id: WastelandOreRichSand
  parent: MarkerBase
  name: planet mineral spawner
  suffix: Soft
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    layers:
    - state: green
    - sprite: Objects/Weapons/Melee/pickaxe.rsi
      state: pickaxe
  - type: EntityTableSpawner
    offset: 0
    table: !type:NestedSelector
      tableId: WastelandOreRichSand
      
