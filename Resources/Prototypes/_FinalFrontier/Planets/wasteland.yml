- type: planet
  id: Wasteland
  biome: FinalFrontierWasteland
  mapName: shuttle-destination-wasteland
  mapLight: "#A8BA72"
  addedComponents:
  - type: FTLDestination
  atmosphere:
    volume: 2500
    temperature: 305.75 # 32.6 celsius
    moles:
    - 32.458
    - 68.213

