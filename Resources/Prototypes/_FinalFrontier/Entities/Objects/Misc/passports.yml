- type: entity
  parent: [Clothing, BaseFoldable]
  id: PassportBase
  name: passport
  description: Papers, please.
  components:
  - type: Appearance
  - type: Foldable
    canFoldInsideContainer: true
    unfoldVerbText: fold-zip-verb
    foldVerbText: fold-unzip-verb
  - type: Sprite
    sprite: _FinalFrontier/Objects/Misc/passport.rsi
    layers:
    - state: base
      map: [ "unfoldedLayer" ]
    - state: base-open
      map: ["foldedLayer"]
      visible: false
  - type: Clothing
    slots:
    - idcard
    sprite: Objects/Misc/id_cards.rsi
  - type: Item
    size: Small
  - type: CargoSellBlacklist
  - type: ShipyardSellCondition
    preserveOnSale: true
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/card_pickup.ogg
      params:
        volume: -5
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_Goobstation/Items/handling/card_drop.ogg
      params:
        volume: -5
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_Goobstation/Items/handling/card_drop.ogg
      params:
        volume: -5