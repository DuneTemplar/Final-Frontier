- type: entity
  name: RA1 rapier
  parent: BaseItem
  id: RCMRapier
  description: Often used by high ranking officers in the Royal Commonwealth's military forces.
  components:
  - type: Sprite
    sprite: _FinalFrontier/Objects/Weapons/Melee/rapier.rsi/icon.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimation: WeaponArcDoubleSlash
    animation: WeaponArcThrust
    wideAnimationRotation: -90
    attackRate: 3.7
    angle: 55
    autoAttack: true
    heavyStaminaCost: 2.5
    clickDamageMultiplier: 1.5
    damage:
      types:
        Slash: 8
        Piercing: 6 # Low damage for the fact that this thing is extremely fast.
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _FinalFrontier/Objects/Weapons/Melee/rapier.rsi
    size: Large
  - type: Utensil
    types:
      - Knife
  - type: Tool
    qualities:
    - Slicing
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Tag
    tags:
    - CaptainSabre
  - type: Reflect
    reflectProb: .25
    spread: 70
  - type: Clothing
    slots:
    - back
    - suitStorage
    
- type: entity
  name: RA2 claymore
  parent: BaseItem
  id: RCMClaymore
  description: Typical blade used by those inclined to melee within the Royal Commonwealth's military forces.
  components:
  - type: Sprite
    sprite: _FinalFrontier/Objects/Weapons/Melee/rcm_claymore.rsi/icon.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimation: WeaponArcHeavySlash
    animation: WeaponArcSlash
    wideAnimationRotation: -90
    attackRate: 1
    clickDamageMultiplier: 1.2
    damage:
      types:
        Slash: 37
    soundHit:
      path: /Audio/Weapons/bladeslice.ogg
  - type: Item
    sprite: _FinalFrontier/Objects/Weapons/Melee/rcm_claymore.rsi
    size: Large
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: IncreaseDamageOnWield
    damage:
      types:
        Slash: 11
  - type: Utensil
    types:
      - Knife
  - type: Tag
    tags:
    - CaptainSabre
  - type: Tool
    qualities:
    - Slicing
  - type: Sharp
  - type: Execution
    doAfterDuration: 4.0
  - type: Reflect
    reflectProb: .05
    spread: 90
  - type: Clothing
    slots:
    - back
    - suitStorage

- type: entity
  name: RA3 heavy war hammer
  parent: BaseItem
  id: RCMHeavyWarHammer
  description: Designed by the Royal Commonwealth's weapons development to be perfect for bashing heads in.
  components:
  - type: Sprite
    sprite: _FinalFrontier/Objects/Weapons/Melee/heavy_warhammer.rsi/icon.rsi
    state: icon
  - type: MeleeWeapon
    wideAnimation: WeaponArcHeavySlash
    wideAnimationRotation: -90
    attackRate: 0.4
    angle: 80
    damage:
      types:
        Blunt: 10
        Structural: 30
    soundHit:
      collection: MetalThud
  - type: Wieldable
  - type: SpeedModifiedOnWield
    walkModifier: 0.85
    sprintModifier: 0.85
  - type: MeleeRequiresWield
  - type: HeldSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: IncreaseDamageOnWield
    damage:
      types:
        Blunt: 45
        Structural: 320
  - type: MeleeThrowOnHit
    stunTime: 0.5
    distance: 0.5
    speed: 18
    activateOnThrown: false
  - type: Item
    sprite: _FinalFrontier/Objects/Weapons/Melee/heavy_warhammer.rsi
    size: Ginormous
  - type: Clothing
    slots:
    - back
    - suitStorage
