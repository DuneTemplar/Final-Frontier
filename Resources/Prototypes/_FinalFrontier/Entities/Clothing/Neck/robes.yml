- type: entity
  parent: ClothingNeckBase
  id: ClothingNeckMechinaeRobesRed
  name: ordo mechinae long robe
  description: The long variant of the robes typically worn by members of the Ordo Mechinae.
  components:
  - type: Sprite
    sprite: _FinalFrontier/Clothing/Neck/Robes/ordo_machinae_robes_red.rsi
  - type: Clothing
    sprite: _FinalFrontier/Clothing/Neck/Robes/ordo_machinae_robes_red.rsi
    forcedLayer: helmetcover
    quickEquip: true
    slots: [ outerClothing, neck ]
  - type: TemperatureProtection
    heatingCoefficient: 0.1
    coolingCoefficient: 0.1
  - type: Armor
    modifiers:
      coefficients:
        Slash: 0.9
        Piercing: 0.95
        Shock: 0.7
  - type: HideLayerClothing
    slots:
    - Hair
    - Snout
    - HeadTop
    - HeadSide
          
